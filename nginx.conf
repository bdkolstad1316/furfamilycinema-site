server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Agent-readiness: Link headers for discoverability
    add_header Link '</sitemap.xml>; rel="sitemap", </llms.txt>; rel="llms-txt", </robots.txt>; rel="robots"' always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Link '</sitemap.xml>; rel="sitemap", </llms.txt>; rel="llms-txt", </robots.txt>; rel="robots"' always;
    }
}
