server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Agent-readiness: Link headers for discoverability
    add_header Link '</sitemap.xml>; rel="sitemap", </llms.txt>; rel="describedby"; type="text/markdown", </robots.txt>; rel="robots"' always;

    # Markdown content negotiation: serve llms.txt when agents request text/markdown
    location = / {
        if ($http_accept ~* "text/markdown") {
            rewrite ^ /llms-markdown last;
        }
        try_files $uri $uri/ /index.html;
    }

    location = /llms-markdown {
        internal;
        alias /usr/share/nginx/html/llms.txt;
        types { }
        default_type text/markdown;
        add_header Content-Type "text/markdown; charset=utf-8" always;
        add_header Link '</sitemap.xml>; rel="sitemap", </llms.txt>; rel="describedby"; type="text/markdown", </robots.txt>; rel="robots"' always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header Link '</sitemap.xml>; rel="sitemap", </llms.txt>; rel="describedby"; type="text/markdown", </robots.txt>; rel="robots"' always;
    }
}
